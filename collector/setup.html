<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMF collector setup</title>
<style>body{background:#101725;color:#e5edf9;font:16px system-ui;max-width:650px;margin:32px auto;padding:16px}section{background:#192337;padding:20px;border-radius:12px;margin:18px 0}label{display:block;margin:14px 0 5px}input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #52627d;border-radius:7px;background:#101725;color:inherit}button{margin-top:18px;background:#225fd2;cursor:pointer}p,small{color:#b8c7dc;line-height:1.6}#status{white-space:pre-line}h2{font-size:19px}.error{color:#ffb5b5}</style>
<h1>OhMyFinance collector</h1><p>This screen stores your Amex login details encrypted for your Windows account on this computer.</p><p id="status" role="status">Loading…</p>
<section><h2>Connect to OMF</h2><form id="pair"><label for="url">OMF address</label><input id="url" type="url" required placeholder="https://your-omf-host"><label for="token">Collector token from OMF → Card connections</label><input id="token" type="password" required autocomplete="off"><button>Save connection</button></form></section>
<main id="accounts"></main><script src="/setup.js"></script></html>
