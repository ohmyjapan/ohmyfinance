<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMF collector setup</title>
<style>:root{color-scheme:light}*{box-sizing:border-box}body{background:#f8fafc;color:#1f2937;font:15px system-ui;max-width:760px;margin:32px auto;padding:16px}section{background:white;border:1px solid #e5e7eb;padding:24px;border-radius:16px;margin:20px 0}label{display:block;font-weight:500;margin:16px 0 6px}input,button{font:inherit;width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;background:white;color:inherit}input:focus-visible,button:focus-visible{outline:3px solid #fecaca;outline-offset:2px}button{margin-top:18px;background:#dc2626;border-color:#dc2626;color:white;font-weight:600;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button.secondary{background:white;border-color:#d1d5db;color:#374151}p,small{color:#64748b;line-height:1.6}h1{font-size:24px;letter-spacing:-.5px;margin-bottom:8px}h2{font-size:19px;font-weight:600;margin:0 0 8px}.status{white-space:pre-line;margin-bottom:0}.tag{font-size:12px;color:#b91c1c;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.actions{display:flex;gap:12px}.actions button{flex:1}@media(max-width:500px){body{margin:12px auto;padding:12px}section{padding:20px}.actions{display:block}}</style>
<header><span class="tag">OhMyFinance</span><h1>Collector setup</h1><p>Save logins encrypted for your Windows account on this computer.</p></header>
<section aria-labelledby="yayoi-heading"><h2 id="yayoi-heading">Yayoi</h2><p id="yayoi-saved">Loading…</p><form id="yayoi-form"><label for="yayoi-username">Yayoi ID (email address)</label><input id="yayoi-username" name="username" type="email" maxlength="254" required autocomplete="off"><label for="yayoi-password">Yayoi password</label><input id="yayoi-password" name="password" type="password" maxlength="256" required autocomplete="off"><div class="actions"><button type="submit" id="yayoi-save">Save encrypted login</button><button type="button" id="yayoi-open" class="secondary" disabled>Open Yayoi</button></div></form><p id="yayoi-status" class="status" role="status" aria-live="polite">Save your login, then open Yayoi in Chrome.</p><small>Additional verification may need your attention in Chrome. Opening Yayoi does not import or register transactions.</small></section>
<section><h2>Connect to OMF</h2><p id="status" class="status" role="status">Loading…</p><form id="pair"><label for="url">OMF address</label><input id="url" type="url" required placeholder="https://your-omf-host"><label for="token">Collector token from OMF → Card connections</label><input id="token" type="password" required autocomplete="off"><button>Save connection</button></form></section>
<main id="accounts"></main><script src="/setup.js"></script></html>
